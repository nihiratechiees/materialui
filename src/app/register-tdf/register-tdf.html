<form #_userform="ngForm" (ngSubmit)="save(_userform)">
<mat-card>
    <mat-card-header>
        <h1>{{title}}</h1>
    </mat-card-header>
    <mat-card-content>
        <mat-form-field class="example-full-width">
            <mat-label>First Name</mat-label>
            <input #firstname="ngModel" matInput required [(ngModel)]="userform.firstname" name="firstname">
           @if(firstname.invalid && firstname.touched){
            <mat-error class="error">First name is required</mat-error>
            }
        </mat-form-field>
        <mat-form-field class="example-full-width">
            <mat-label>LastName</mat-label>
            <input matInput required [(ngModel)]="userform.lastname" name="lastname">    
        </mat-form-field>
        <mat-form-field class="example-full-width">
            <mat-label>Email</mat-label>
            <input matInput required email [(ngModel)]="userform.email" name="email">
        </mat-form-field>
        <mat-form-field class="example-full-width">
            <mat-label>Password</mat-label>
            <input matInput required type="password" [(ngModel)]="userform.password" name="password">
        </mat-form-field>
         
        <mat-form-field class="example-full-width">
            <mat-label>Address</mat-label>
            <textarea matInput ></textarea>
        </mat-form-field>


        <section class="example-section">
            <mat-checkbox class="example-margin" required [(ngModel)]="userform.isconfirm" name="isconfirm">Agree Terms & conditions?</mat-checkbox>
        </section>


    </mat-card-content>
    <mat-card-actions>
        <button type="submit" [disabled]="_userform.invalid"  matButton="filled" color="primary">Register</button>
        <a  matButton="outlined" (click)="Login()">Already Registered?</a>
    </mat-card-actions>
</mat-card>
</form>
